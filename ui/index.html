<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main">
  <section class="hero" id="top" data-enter>
    <div class="wrap">
      <div class="hero-text">
        <h1 id="title">CPU</h1>
        <p class="head__meta">
          <span id="metric">Cinebench R23 多核</span>
          <span id="count">104 款</span>
        </p>
        <div class="plot" id="plot">
          <div class="plot__tools" role="group" aria-label="图表视图">
            <button type="button" class="tool" data-act="out" aria-label="缩小">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
            </button>
            <button type="button" class="tool" data-act="in" aria-label="放大">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>
            </button>
            <button type="button" class="tool" data-act="reset" aria-label="复位" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8.6A5.2 5.2 0 1 1 11.4 4"/><path d="M13.4 2v3h-3"/></svg>
            </button>
            <button type="button" class="tool tool--full" data-act="full" aria-label="全屏" aria-pressed="false">
              <svg class="i-open" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 2H2v4.2M9.8 2H14v4.2M6.2 14H2V9.8M9.8 14H14V9.8"/></svg>
              <svg class="i-close" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2h4.2V2M14 6.2H9.8V2M2 9.8h4.2V14M14 9.8H9.8V14"/></svg>
            </button>
          </div>
          <svg id="chart" role="img" aria-label="价格与能力分布图"></svg>
          <div class="tip" id="tip" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <section class="board" id="board">
    <div class="wrap">
      <div class="board__bar">
        <h2>排行</h2>
        <div class="sort" role="group" aria-label="排序方式">
          <button type="button" data-sort="score" aria-pressed="true">能力</button>
          <button type="button" data-sort="price" aria-pressed="false">价格</button>
          <button type="button" data-sort="value" aria-pressed="false">性价比</button>
        </div>
      </div>
      <table id="board-table">
        <caption class="vh" id="caption">按能力排行</caption>
        <thead>
          <tr>
            <th scope="col" class="c-rank">#</th>
            <th scope="col" class="c-name">型号</th>
            <th scope="col" class="c-spec" id="spec-head">核心</th>
            <th scope="col" class="c-num">能力</th>
            <th scope="col" class="c-num">价格</th>
            <th scope="col" class="c-val">每美元</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <div class="snap">
        <p id="snap-line">快照</p>
        <button type="button" class="btn" id="import">导入快照</button>
        <input type="file" id="file" accept=".json,application/json" hidden>
        <p class="snap__status" id="status" role="status"></p>
      </div>
    </div>
  </section>
</main>
<script src="nous-plugin.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
